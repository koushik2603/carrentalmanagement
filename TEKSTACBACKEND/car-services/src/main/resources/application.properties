spring.application.name=car-service
server.port=0
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# MODIFIED: Database Configuration
spring.datasource.driver-class=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/caaar}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ... (JSP view properties are fine) ...
spring.mvc.view.prefix=/WEB-INF/Views/
spring.mvc.view.suffix=.jsp

# MODIFIED: Eureka Configuration
eureka.client.serviceurl.defaultZone=${EUREKA_URI:http://localhost:9014/eureka}
eureka.instance.prefer-ip-address=false

# MODIFIED: JWT Secret
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}