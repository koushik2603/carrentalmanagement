version: '3.8'

services:
  # The MySQL Database Service
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: "root"
      MYSQL_DATABASE: caaar
    networks:
      - car-network
    volumes:
      - mysql-data:/var/lib/mysql

  # 1. Discovery Server (Eureka)
  discoveryserver:
    build: ./discoveryserver
    networks:
      - car-network

  # 2. API Gateway
  apigateway:
    build: ./apigateway
    networks:
      - car-network
    depends_on:
      - discoveryserver
    environment:
      EUREKA_URI: http://discoveryserver:9014/eureka
      # Allow requests from any IP for testing
      CORS_ALLOWED_ORIGIN: "*"

  # 3. User Authentication Service
  userauthservice:
    build: ./userauthservices
    networks:
      - car-network
    depends_on:
      - discoveryserver
      - mysql-db
    environment:
      EUREKA_URI: http://discoveryserver:9014/eureka
      DB_URL: jdbc:mysql://mysql-db:3306/caaar
      DB_USER: root
      DB_PASSWORD: "root"

  # 4. Car Service
  carservice:
    build: ./car-services
    networks:
      - car-network
    depends_on:
      - discoveryserver
      - mysql-db
    environment:
      EUREKA_URI: http://discoveryserver:9014/eureka
      DB_URL: jdbc:mysql://mysql-db:3306/caaar
      DB_USER: root
      DB_PASSWORD: "root"
      JWT_SECRET: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437" # CHANGE THIS

  # 5. Frontend Service (React App) - MODIFIED
  frontend:
    build: .
    networks:
      - car-network
    depends_on:
      - apigateway
    ports:
      # Exposes the frontend to the internet on port 80 (HTTP)
      - "80:3000" # Assumes your React app runs on port 3000 inside the container

networks:
  car-network:
    driver: bridge

volumes:
  mysql-data:
