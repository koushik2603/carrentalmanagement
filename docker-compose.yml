version: '3.8'

services:
  # The MySQL Database Service
  mysql-db:
    image: mysql:8.0
    environment:
      # Password is set to 'root' as requested
      MYSQL_ROOT_PASSWORD: "root" 
      MYSQL_DATABASE: caaar
    networks:
      - car-network
    volumes:
      - mysql-data:/var/lib/mysql

  # 1. Discovery Server (Eureka)
  discoveryserver:
    build: ./discoveryserver
    networks:
      - car-network

  # 2. API Gateway
  apigateway:
    build: ./apigateway
    networks:
      - car-network
    depends_on:
      - discoveryserver
    environment:
      EUREKA_URI: http://discoveryserver:9014/eureka
      # Set to '*' for testing without a domain. Change this later!
      CORS_ALLOWED_ORIGIN: "*" 

  # 3. User Authentication Service
  userauthservice:
    build: ./userauthservices
    networks:
      - car-network
    depends_on:
      - discoveryserver
      - mysql-db
    environment:
      EUREKA_URI: http://discoveryserver:9014/eureka
      DB_URL: jdbc:mysql://mysql-db:3306/caaar
      DB_USER: root
      # Password is set to 'root'
      DB_PASSWORD: "root"

  # 4. Car Service
  carservice:
    build: ./car-services
    networks:
      - car-network
    depends_on:
      - discoveryserver
      - mysql-db
    environment:
      EUREKA_URI: http://discoveryserver:9014/eureka
      DB_URL: jdbc:mysql://mysql-db:3306/caaar
      DB_USER: root
      # Password is set to 'root'
      DB_PASSWORD: "root"
      # You should still change this to a long, random secret
      JWT_SECRET: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437" 

  # 5. Frontend Service (React App)
  frontend:
    build: .
    networks:
      - car-network
    depends_on:
      - apigateway

  # 6. Nginx Reverse Proxy
  nginx:
    image: nginx:latest
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
    networks:
      - car-network
    depends_on:
      - frontend
      - apigateway

networks:
  car-network:
    driver: bridge

volumes:
  mysql-data:
