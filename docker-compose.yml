version: '3.8'

services:
  # The MySQL Database Service
  mysql-db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: your_strong_database_password # CHANGE THIS
      MYSQL_DATABASE: caaar
    networks:
      - car-network
    volumes:
      - mysql-data:/var/lib/mysql

  # 1. Discovery Server (Eureka)
  discoveryserver:
    build: ./discoveryserver
    networks:
      - car-network

  # 2. API Gateway
  apigateway:
    build: ./apigateway
    networks:
      - car-network
    depends_on:
      - discoveryserver
    environment:
      EUREKA_URI: http://discoveryserver:9014/eureka
      # This will be your domain name, e.g., https://www.yourcarrental.com
      CORS_ALLOWED_ORIGIN: https://www.yourdomain.com # CHANGE THIS

  # 3. User Authentication Service
  userauthservice:
    build: ./userauthservices
    networks:
      - car-network
    depends_on:
      - discoveryserver
      - mysql-db
    environment:
      EUREKA_URI: http://discoveryserver:9014/eureka
      DB_URL: jdbc:mysql://mysql-db:3306/caaar
      DB_USER: root
      DB_PASSWORD: your_strong_database_password # CHANGE THIS (must match mysql-db)

  # 4. Car Service
  carservice:
    build: ./car-services # Corrected folder name
    networks:
      - car-network
    depends_on:
      - discoveryserver
      - mysql-db
    environment:
      EUREKA_URI: http://discoveryserver:9014/eureka
      DB_URL: jdbc:mysql://mysql-db:3306/caaar
      DB_USER: root
      DB_PASSWORD: your_strong_database_password # CHANGE THIS (must match mysql-db)
      JWT_SECRET: your_super_strong_production_jwt_secret # CHANGE THIS

  # 5. Frontend Service (React App)
  frontend:
    build: . # Assuming your frontend Dockerfile is in the root
    networks:
      - car-network
    depends_on:
      - apigateway

  # 6. Nginx Reverse Proxy (Handles all incoming traffic)
  nginx:
    image: nginx:latest
    ports:
      - "80:80"   # For HTTP
      - "443:443" # For HTTPS
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/www:/var/www/certbot/:ro
      - ./certbot/conf/:/etc/nginx/ssl/:ro
    networks:
      - car-network
    depends_on:
      - frontend
      - apigateway

networks:
  car-network:
    driver: bridge

volumes:
  mysql-data: # This ensures your database data is saved